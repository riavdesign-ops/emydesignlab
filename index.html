<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EMY Design Lab — Creative Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,300&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-light: #F4F1EA;
    --card-white: #FFFFFF;
    --card-pill: #FAF9F5;
    --ink-black: #1A1B1E;
    --ink-gray: #555861;
    --ink-muted: #888B94;
    --wine-burgundy: #8B1A2B;
    --border-burgundy: #8B1A2B;
    --border-light: rgba(139, 26, 43, 0.25);
    --font-serif: 'Cinzel', serif;
    --font-sans: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-light);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .deck-container {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header.global-masthead {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 36px;
    background: var(--bg-light);
    border-bottom: 1px solid var(--border-light);
    z-index: 100;
    flex-shrink: 0;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    text-decoration: none;
  }

  .brand-logo {
    height: 36px;
    width: auto;
    object-fit: contain;
    display: block;
    background: transparent !important;
  }

  .brand-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-black);
  }

  .brand-subtitle {
    font-family: var(--font-mono);
    font-size: 8.5px;
    color: var(--wine-burgundy);
    letter-spacing: 0.15em;
  }

  .slide-nav-headings {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .nav-heading-btn {
    background: transparent;
    border: 1px solid transparent;
    padding: 6px 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-gray);
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    border-radius: 2px;
    white-space: nowrap;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-heading-btn:hover {
    color: var(--wine-burgundy);
    background: rgba(139, 26, 43, 0.06);
  }

  .nav-heading-btn.active {
    background: var(--wine-burgundy);
    color: #FFF !important;
    border-color: var(--wine-burgundy);
    font-weight: 600;
  }

  .slide-viewport {
    flex: 1;
    position: relative;
    width: 100%;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    opacity: 0;
    background-color: var(--bg-light);
    color: var(--ink-black);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transition: opacity 0.25s ease-in-out;
  }

  .slide.active {
    display: flex;
    opacity: 1;
    z-index: 2;
  }

  .canvas {
    flex: 1;
    position: relative;
    padding: 24px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 1360px;
    margin: 0 auto;
    width: 100%;
  }

  .slide-inner-centered {
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    margin: auto 0;
  }

  .slide-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 36px;
    border-top: 1px solid var(--border-light);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-gray);
    z-index: 10;
    flex-shrink: 0;
    background: var(--bg-light);
  }

  .slide1-hero-logo {
    height: 150px;
    width: auto;
    object-fit: contain;
    display: block;
    margin-bottom: 18px;
    background: transparent !important;
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--wine-burgundy);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kicker::before {
    content: "";
    display: inline-block;
    width: 18px;
    height: 1px;
    background: var(--wine-burgundy);
  }

  .headline-giant {
    font-family: var(--font-serif);
    font-size: clamp(26px, 3.4vw, 42px);
    line-height: 1.12;
    font-weight: 400;
    margin-bottom: 14px;
  }

  .grid-2col {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    width: 100%;
    gap: 36px;
    align-items: center;
  }

  .deck-card {
    border: 1px solid var(--border-burgundy);
    background: var(--card-white);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-radius: 3px;
    box-shadow: 0 2px 8px rgba(139, 26, 43, 0.04);
  }

  .card-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--wine-burgundy);
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
    font-weight: 600;
    height: 16px;
    line-height: 16px;
  }
  .card-title {
    font-family: var(--font-serif);
    font-size: 17px;
    margin-bottom: 6px;
  }
  .card-body {
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-gray);
  }
  .card-bottom-tag {
    font-family: var(--font-mono);
    font-size: 8.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-top: 1px dashed var(--border-light);
    padding-top: 8px;
    margin-top: 12px;
    color: var(--wine-burgundy);
  }

  .action-btn {
    display: inline-block;
    background: var(--wine-burgundy);
    color: #FFF;
    border: 1px solid var(--wine-burgundy);
    padding: 10px 22px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    border-radius: 2px;
  }
  .action-btn:hover {
    background: var(--ink-black);
    border-color: var(--ink-black);
  }

  .course-pill-card {
    background: var(--card-pill);
    border: 1px solid var(--border-burgundy);
    padding: 12px 14px;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .course-pill-card h5 {
    font-family: var(--font-serif);
    font-size: 13.5px;
    margin-bottom: 4px;
    color: var(--ink-black);
  }
  .course-pill-card p {
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--ink-gray);
  }

  .slide6-column-card {
    padding: 12px !important;
    justify-content: flex-start !important;
    display: flex !important;
    flex-direction: column !important;
    min-height: 290px;
  }
  .slide6-column-card .card-label {
    margin-bottom: 8px !important;
    flex-shrink: 0;
  }

  @media (max-width: 900px) {
    header.global-masthead {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 16px;
    }

    .slide-nav-headings {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .slide-nav-headings::-webkit-scrollbar {
      display: none;
    }
    .nav-heading-btn {
      padding: 5px 8px;
      font-size: 9px;
      flex-shrink: 0;
    }

    .canvas {
      padding: 16px 16px 36px 16px;
      justify-content: flex-start;
    }

    .slide-inner-centered {
      margin: 0;
    }

    .grid-2col {
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .mobile-stack-3, .mobile-stack-4, .mobile-stack-5 {
      display: grid;
      grid-template-columns: 1fr !important;
      gap: 12px !important;
    }

    .slide-footer {
      flex-direction: column;
      gap: 4px;
      text-align: center;
      padding: 8px 14px;
      font-size: 8px;
    }
  }

  @media print {
    body, .deck-container { overflow: visible; height: auto; }
    header.global-masthead { display: none; }
    .slide { position: relative; display: flex !important; opacity: 1 !important; width: 100vw; height: 100vh; page-break-after: always; break-after: page; }
  }
</style>
</head>
